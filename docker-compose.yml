version: '3.8'

services:
  backend:
    build:
      context: ./server
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=*
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
